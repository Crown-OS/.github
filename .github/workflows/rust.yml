name: Rust

# Reusable CI for every CrownOS Rust repository.
#
# Callers live in each repo as .github/workflows/ci.yml and pass only what
# differs — extra pacman packages, whether tests need a D-Bus session.
#
# Two CrownOS specifics drive the design:
#
#   1. Crates depend on each other by `path = "../crownos-config"`, so the
#      checkout is a FLAT SIBLING layout. prepare-workspace checks the caller
#      out into a directory named after itself and clones every sibling it
#      references next to it.
#   2. Clippy does not block. The backlog is burned down first, then
#      `-D warnings` gets turned on here in one place.

on:
  workflow_call:
    inputs:
      packages:
        description: >
          Extra pacman packages beyond the CrownOS base set. Example:
          "libdrm libinput"
        type: string
        default: ''
      dbus:
        description: >
          Run tests under dbus-run-session with --test-threads=1. Needed by
          crownotify, whose tests register real well-known session-bus names.
        type: boolean
        default: false
      test:
        description: Run the test suite.
        type: boolean
        default: true
      toolchain:
        description: Rust toolchain. A repo's rust-toolchain.toml still wins.
        type: string
        default: stable

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep tests away from a real ~/.config/crownos. CROWN_CONFIG_DIR is
  # process-global, which is also why crownos-config's e2e suite is a single
  # test function.
  CROWN_CONFIG_DIR: /tmp/crownos-ci

jobs:
  check:
    name: fmt / build / clippy / test
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.event.repository.name }}
    steps:
      - uses: Crown-OS/.github/.github/actions/prepare-workspace@main
        with:
          packages: ${{ inputs.packages }}
          toolchain: ${{ inputs.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ github.event.repository.name }}

      # Workspace members only: `--all` would also format the sibling path
      # dependencies, which their own CI already checks.
      - name: rustfmt
        run: cargo fmt --check

      - name: Build
        run: |
          locked=()
          [ -f Cargo.lock ] && locked=(--locked)
          cargo build --all-targets "${locked[@]}"

      # Non-blocking on purpose. Drop `continue-on-error` once the backlog is
      # cleared — this is the only place that needs changing.
      - name: Clippy (advisory)
        id: clippy
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: Note clippy result
        if: steps.clippy.outcome == 'failure'
        run: |
          {
            echo "### Clippy reported warnings"
            echo ""
            echo "Advisory only — this does not fail the build yet."
            echo "See the *Clippy (advisory)* step for the output."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        if: inputs.test && !inputs.dbus
        run: cargo test --all

      # crownotify's tests register real well-known names on the session bus,
      # so they need a bus to exist and must not run concurrently.
      - name: Test (under a D-Bus session)
        if: inputs.test && inputs.dbus
        run: dbus-run-session -- cargo test --all -- --test-threads=1
