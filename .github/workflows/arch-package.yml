# Reusable CD that turns a v* tag into an Arch package on a published GitHub
# Release. Crown-OS/crownos-iso downloads the latest release of every component
# and bakes the packages into the ISO, so the release must not be a draft:
# `gh release download` never sees drafts.
#
# Every binary target in the workspace is packaged into /usr/bin. Runtime
# dependencies come from `ldd` on those binaries, plus `depends` for libraries
# that are dlopen'd and so invisible to it (Vulkan, Wayland, xkbcommon).
#
# Path dependencies outside the repository (`../crownos-config`, `../vendor`)
# are cloned flat from Crown-OS until none is missing. A directory whose
# repository is named differently is mapped through `aliases`.

name: Arch package

on:
  workflow_call:
    inputs:
      packages:
        description: Extra pacman packages needed to build, beyond the base set.
        type: string
        default: ''
      depends:
        description: Runtime packages ldd cannot see because they are dlopen'd.
        type: string
        default: wayland libxkbcommon vulkan-icd-loader
      aliases:
        description: >-
          Space-separated dir=repository pairs for siblings whose directory
          differs from their repository name. Example: "llts-protocol=lls-protocol"
        type: string
        default: ''

permissions:
  contents: write

jobs:
  package:
    name: build and publish
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    env:
      REPOSITORY: ${{ github.event.repository.name }}
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel rustup clang git github-cli jq \
            wayland wayland-protocols libxkbcommon vulkan-icd-loader vulkan-headers mesa \
            fontconfig freetype2 dbus bluez-libs libxcb libx11 systemd-libs \
            ${{ inputs.packages }}
          rustup default stable

      - uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name }}

      - name: Check out sibling repositories
        env:
          ALIASES: ${{ inputs.aliases }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          declare -A repository_of
          for pair in $ALIASES; do repository_of[${pair%%=*}]=${pair#*=}; done

          missing_siblings() {
            find . -name Cargo.toml -not -path '*/target/*' -print0 |
              while IFS= read -r -d '' manifest; do
                sed -nE 's/.*path *= *"([^"]+)".*/\1/p' "$manifest" |
                  while read -r relative; do
                    realpath -m --relative-to=. "$(dirname "$manifest")/$relative" | cut -d/ -f1
                  done
              done | sort -u | while read -r dir; do [ -e "$dir" ] || echo "$dir"; done
          }

          while missing=$(missing_siblings) && [ -n "$missing" ]; do
            for dir in $missing; do
              repository=${repository_of[$dir]:-$dir}
              git clone --quiet --depth 1 "https://github.com/Crown-OS/$repository.git" "$dir" ||
                { echo "::error::path dependency ../$dir has no Crown-OS/$repository repository"; exit 1; }
            done
          done

      - name: Build
        working-directory: ${{ github.event.repository.name }}
        run: cargo build --release --bins $([ -f Cargo.lock ] && echo --locked)

      - name: Write PKGBUILD
        working-directory: ${{ github.event.repository.name }}
        env:
          EXTRA_DEPENDS: ${{ inputs.depends }}
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          target_dir=$(jq -r .target_directory <<<"$metadata")
          mapfile -t binaries < <(jq -r --arg dir "$target_dir/release" \
            '.packages[].targets[] | select(.kind | index("bin")) | "\($dir)/\(.name)"' <<<"$metadata" | sort -u)
          [ ${#binaries[@]} -gt 0 ] || { echo "::error::no binary targets to package"; exit 1; }

          description=$(jq -r '[.packages[].description | select(.)][0] // ""' <<<"$metadata")
          license=$(jq -r '[.packages[].license | select(.)][0] // "custom"' <<<"$metadata")
          mapfile -t depends < <({
            ldd "${binaries[@]}" | awk '$2 == "=>" && $3 ~ /^\// { print $3 }' | xargs -r pacman -Qqo
            printf '%s\n' $EXTRA_DEPENDS
          } | sort -u | awk NF)

          version=${GITHUB_REF_NAME#v}
          mkdir -p ../pkgbuild
          {
            echo "pkgname=$REPOSITORY"
            echo "pkgver=${version//-/_}"
            echo "pkgrel=1"
            echo "pkgdesc=$(printf '%q' "$description")"
            echo "arch=(x86_64)"
            echo "license=($(printf '%q' "$license"))"
            echo "depends=(${depends[*]})"
            echo "options=(!debug)"
            echo "package() {"
            echo "  install -Dm755 -t \"\$pkgdir/usr/bin\" ${binaries[*]@Q}"
            echo "}"
          } > ../pkgbuild/PKGBUILD
          cat ../pkgbuild/PKGBUILD

      - name: Package
        run: |
          useradd --create-home builder
          chown -R builder pkgbuild
          cd pkgbuild && runuser -u builder -- makepkg --nodeps --noconfirm

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" pkgbuild/*.pkg.tar.zst --repo "$GITHUB_REPOSITORY" --clobber
