# The one place CrownOS declares dependency versions.
#
# scripts/check-versions.py compares every repo's Cargo.toml against this file
# and fails CI on drift. It is deliberately NARROW: it covers the CrownOS crates
# themselves plus the third-party dependencies that more than one repo declares.
# Everything else stays in the repo that uses it -- a linter that tries to own
# every version becomes the thing everyone disables.
#
# Ongoing bumps: use Renovate or Dependabot to raise versions here first, then
# `scripts/sync-versions.py` to propagate. Do not hand-edit the repos.

[meta]
msrv = "1.88"   # vello 0.9 and xilem 0.4 both declare 1.88; wgpu 29 declares 1.87.
                # Must match rust-toolchain.toml in every repo.

# ---------------------------------------------------------------------------
# CrownOS crates. Downstream repos depend on these by version, never by path or
# git -- that is what makes every checkout resolve identically.
# ---------------------------------------------------------------------------
[crownos]
crownshell = "0.3"
crownos-config = "0.2"
crownuikit = "0.1"
crownpositor-config = "0.1"

# ---------------------------------------------------------------------------
# Shared third-party dependencies. Listed only where 2+ repos declare them.
# ---------------------------------------------------------------------------
[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.20"
serde = "1.0.228"
log = "0.4"
env_logger = "0.11"
tracing = "0.1.44"
chrono = "0.4.45"
dirs = "6"
ron = "0.12"
notify = "8"
tokio = "1"
parking_lot = "0.12.5"
regex = "1.13.1"

# The Wayland client stack. crowndictator's manifest used to carry the comment
# "versions matched to crownshell" above these -- that hand-alignment is what
# this file replaces.
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-protocols = "0.32"
calloop-wayland-source = "0.3"

# Event loop. crownshell, crowndictator and crownotify are on 0.13; crownpositor
# is a compositor and tracks 0.14. Pinned so the split stays two versions rather
# than four.
calloop = "0.13"

# crownbar declares battery for its battery widget. `bluer` used to be pinned
# here too; crownshell and crownbar both declared it and neither ever called it,
# so it is gone from the tree and from this file.
battery = "0.7.8"

# Lane B's entry point. crownos-config declares it optional-but-default-on and
# crownuikit declares it outright; both are on 0.4.0. This is the single knob
# that decides whether a repo pulls the second graphics stack, so it is worth
# more than a comment.
xilem = "0.4.0"

# Graphics. See the two-lane note below.
vello = "0.9.0"
tiny-skia = "0.11"
parley = "0.6"
bytemuck = "1"

# ---------------------------------------------------------------------------
# Known, deliberate exceptions. check-versions.py allows these to differ.
#
# An exception is only meaningful for a dependency that is otherwise pinned
# above -- check() skips anything unpinned, so an exception for an unpinned
# dependency enforces nothing while reading like a decision. `check-versions.py
# --lint-spec` now fails on that, which is how five dead entries here were found.
# ---------------------------------------------------------------------------
[exceptions]
# TWO GRAPHICS LANES, decision deferred.
#
#   Lane A  crownshell, crownbar, crowndock, crownotify
#           vello 0.9 -> wgpu 29, peniko 0.6, kurbo 0.13
#   Lane B  crownuikit, crownos-config
#           xilem 0.4 -> vello 0.6 -> wgpu 26, peniko 0.5, kurbo 0.12
#
# crowndictator depends on both and locks 661 packages with two wgpu, two
# vello and two calloop; every other repo is 300-430. The mechanism is
# crownos-config's `default = ["xilem"]` on an optional dependency -- a settings
# crate pulling a GPU stack by default. crownpositor already opts out with
# default-features = false; crowndictator could do the same unilaterally.
#
# Until that is decided, both lanes are pinned so neither drifts further.
# TWO GRAPHICS LANES, decision deferred.
#
#   Lane A  crownshell, crownbar, crowndock, crownotify
#           vello 0.9 -> wgpu 29, peniko 0.6, kurbo 0.13
#   Lane B  crownuikit, crownos-config
#           xilem 0.4 -> vello 0.6 -> wgpu 26, peniko 0.5, kurbo 0.12
#
# crowndictator depends on both and locks 661 packages with two wgpu, two
# vello and two calloop; every other repo is 300-430. The mechanism is
# crownos-config's `default = ["xilem"]` on an optional dependency -- a settings
# crate pulling a GPU stack by default. crownpositor already opts out with
# default-features = false; crowndictator could do the same unilaterally.
#
# There is deliberately no exception entry for lane B: neither crownuikit nor
# crownos-config declares vello directly. They reach 0.6 transitively through
# xilem 0.4, which this file does not and cannot govern. The two entries that
# used to sit here claimed to pin something they never touched.

# crownpositor is a Wayland *server*; it needs the compositor-side stack, which
# moves independently of the client-side versions above. Both of these are live
# now that `calloop` and `tiny-skia` are pinned.
"crownpositor.calloop" = "0.14.4"
"crownpositor.tiny-skia" = "0.12.0"

# crowndock still declares dirs 5 while everything else is on 6. Not yet
# migrated; listed here so it is a tracked exception rather than silent drift.
"crowndock.dirs" = "5"

# NOT EXCEPTIONS, because nothing else declares them -- kept as notes so the
# reasoning is not lost:
#
#   crownpositor `wayland-server = "0.31.14"`  -- only the compositor is a
#   Wayland server, so there is no second declaration to drift against.
#
#   crownotify `smol = "2.0.2"` -- crownotify uses smol as well as tokio. Three
#   async runtimes coexist in the tree (tokio, smol, calloop); consolidating
#   them is a separate decision.
#
#   crowndictator `ort = "=2.0.0-rc.12"` -- exact-pinned release candidate. The
#   cuda feature is not optional and default-features are not disabled, so
#   ort-sys downloads a prebuilt ONNX Runtime at build time, which also makes
#   crowndictator's docs.rs build fail because docs.rs blocks network access.
